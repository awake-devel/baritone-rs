# Test bundle for baritone-rs: answers, in the real game, whether a mod can walk, jump, sneak and sprint through the
# stable `native_movement_input` hook with the chat (or the inventory) open. It runs a fixed scenario by itself once
# the environment variable BARITONE_PROBE_DIR names a folder, and writes a CSV there. Pinned like walk-test: it reads
# private `Game` fields (player, screen, yaw, integrated) and calls the chat and server-command helpers.
[mod]
id = "baritone_probe"
version = "0.0.0"
priority = 100

[compatibility]
horizon_revision = "66f3981f522b24c250b21523a70080965b940424"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "baritone_probe"
source = "runtime.rs"

[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "movement"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_movement_input"
helper = "movement.rs"
bindings = [
  { name = "forward", ty = "&mut f32", value = "&mut *forward" },
  { name = "strafe", ty = "&mut f32", value = "&mut *strafe" },
  { name = "jump", ty = "&mut bool", value = "&mut *jump" },
  { name = "sneak", ty = "&mut bool", value = "&mut *sneak" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]
