# baritone-rs: a Rust port of the Baritone pathfinder as a native Horizon mod.
# LGPL-3.0-or-later, like the rest of this repository. Ported from cabaletta/baritone, see ../CREDITS.md.
#
# Walks, sprints, breaks and places along a path: `/b goto`, `mine`, `build`, `resume`, `goal`, `path`, `eta`, `set`, `stop`, and the path drawn in the world.
#
# The mod reads private `Game` fields (the player, the hotbar, the world, the view angles, the screen, the border and the resources),
# so it pins the Horizon revision it was written against. Most hooks are the stable `native_*` ones. Two private functions are hooked
# as well, both pinned: the game's input step (`remote_handle_input`, for the mouse buttons with the chat open) and the command tree's
# completion (`Dispatcher::client_suggestions_asking`, for the words after `/b`).
[mod]
id = "baritone_rs"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "66f3981f522b24c250b21523a70080965b940424"

# The engine: Baritone's rules in plain Rust, with no Horizon types. Built apart from the game crate.
[[crate]]
id = "engine"
path = "engine"

# The glue that turns Horizon's block data into the engine's block table. One file, also compiled by tools/facts-compare.
[[module]]
id = "facts"
file = "crates/horizon-client/src/game.rs"
name = "baritone_rs_facts"
source = "glue/state_facts.rs"

# State, snapshots, the tick, the commands and the drawing.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "baritone_rs"
source = "runtime.rs"

# The seam for completing the words after `/b`: added to the command crate, called by the hook "suggest" below.
[[module]]
id = "suggest_seam"
file = "crates/horizon-command/src/lib.rs"
name = "baritone_rs_suggest"
source = "glue/suggest.rs"
visibility = "pub"

[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "movement"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_movement_input"
helper = "movement.rs"
bindings = [
  { name = "forward", ty = "&mut f32", value = "&mut *forward" },
  { name = "strafe", ty = "&mut f32", value = "&mut *strafe" },
  { name = "jump", ty = "&mut bool", value = "&mut *jump" },
  { name = "sneak", ty = "&mut bool", value = "&mut *sneak" },
]

[[injection]]
id = "command"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_command"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

[[injection]]
id = "commands"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_commands"
helper = "commands.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<&'static str>", value = "&mut *commands" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "primitives"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_world_primitives"
helper = "primitives.rs"
bindings = [
  { name = "primitives", ty = "&mut horizon_client::world_primitives::WorldPrimitives", value = "&mut *primitives" },
]

# The level is dropped: leaving the server, or changing dimension.
[[injection]]
id = "level_unload"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_client_level_unload"
helper = "unload.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# The connection is about to be discarded.
[[injection]]
id = "disconnecting"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_client_disconnecting"
helper = "disconnecting.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
]

# The server begins an orderly stop, which is what quitting the game from a single player world does: the chunk cache is saved while the process is alive.
[[injection]]
id = "server_stopping"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_server_stopping"
helper = "stopping.rs"
bindings = [
  { name = "dedicated", ty = "bool", value = "dedicated" },
]

# The game's input step runs inside `tick_remote_level`, before the player moves. It turns `game.left` and `game.right` into mining and use, but
# only with `Screen::Playing`. These two hooks set the buttons for the executor and, with the chat open, show it `Playing` for that one call.
[[injection]]
id = "input_head"
kind = "HEAD"
target = "horizon_client::game::remote::Game<'_>::remote_handle_input"
helper = "input_head.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "input_return"
kind = "RETURN"
target = "horizon_client::game::remote::Game<'_>::remote_handle_input"
helper = "input_return.rs"
bindings = [
  { name = "value", ty = "()", value = "$value" },
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# The chat box's completion at the cursor. The command tree has nothing past `/b `; the mod's function offers the commands, the settings and the
# coordinates (the block under the crosshair comes from the registries the chat already fills).
[[injection]]
id = "suggest"
kind = "RETURN"
target = "horizon_command::Dispatcher::client_suggestions_asking"
helper = "suggest.rs"
bindings = [
  { name = "value", ty = "(Range, Vec<Suggestion>, bool)", value = "$value" },
  { name = "parse", ty = "&ParseResults", value = "parse" },
  { name = "cursor", ty = "usize", value = "cursor" },
  { name = "reg", ty = "&Registries", value = "reg" },
]
